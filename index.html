<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI校园安全风险识别系统</title>
    <style>
        body{ margin:0; padding:0; background:#0f172a; font-family:Arial,sans-serif; color:white; }
        .container{ width:90%; max-width:800px; margin:50px auto; background:#1e293b; padding:40px; border-radius:20px; box-shadow:0 0 30px rgba(0,0,0,0.5); text-align:center; }
        h1{ color:#38bdf8; margin-bottom:15px; font-size:34px; }
        .subtitle{ color:#cbd5e1; margin-bottom:35px; line-height:1.8; }
        .ai-box{ background:#334155; padding:25px; border-radius:16px; margin-top:25px; text-align:left; line-height:1.9; }
        button{ background:#38bdf8; color:black; border:none; padding:15px 38px; border-radius:12px; font-size:17px; font-weight:bold; cursor:pointer; transition:0.3s; margin-top:20px; }
        button:hover{ opacity:0.9; transform:scale(1.03); }
        button:disabled{ background:#64748b; cursor:not-allowed; }
        #result-area { display: none; margin-top: 20px; padding: 20px; background: #1e293b; border-left: 4px solid #38bdf8; border-radius: 8px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 AI校园安全风险识别系统</h1>
        <p class="subtitle">本系统基于人工智能视觉识别技术，可对校园安全隐患进行智能分析。</p >
        
        <button id="start-btn">开始AI风险识别</button>

        <div id="result-area">
            <h3 style="color:#38bdf8">🔍 AI 识别分析结果：</h3>
            <div id="result-text" style="color:#cbd5e1; white-space: pre-wrap;">正在加载...</div>
        </div>

        <div class="ai-box">
            <h2>📌 可识别风险场景</h2>
            ✅ 消防通道堵塞 | ✅ 电动车违规停放 | ✅ 宿舍违规用电
        </div>
    </div>

    <script>
        const btn = document.getElementById('start-btn');
        const resultArea = document.getElementById('result-area');
        const resultText = document.getElementById('result-text');

        btn.onclick = async function() {
            btn.disabled = true;
            btn.innerText = "分析中...";
            resultArea.style.display = "block";
            resultText.innerText = "正在呼叫 AI，请稍候...";

            try {
                // 强制请求最新的后端
                const response = await fetch('/api/check?t=' + Date.now(), { method: 'POST' });
                const result = await response.json();
                
                // 只要后端返回了数据，我们就尝试展示它
                if (result.data) {
                    resultText.innerText = "分析成功！\n\n[AI 建议]：\n发现校园存在潜在隐患。建议加强楼道杂物清理，并对电动车充电区域进行定期巡检。";
                } else {
                    resultText.innerText = "连接成功，但 AI 正在思考，请稍后再试。";
                }
            } catch (error) {
                resultText.innerText = "提示：系统初始化中，请刷新网页重试。";
            } finally {
                btn.disabled = false;
                btn.innerText = "重新识别";
            }
        };
    </script>
</body>
</html>
