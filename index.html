<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI校园安全风险识别系统</title>
    <style>
        body{ margin:0; padding:0; background:#0f172a; font-family:Arial,sans-serif; color:white; }
        .container{ width:90%; max-width:800px; margin:50px auto; background:#1e293b; padding:40px; border-radius:20px; box-shadow:0 0 30px rgba(0,0,0,0.5); text-align:center; }
        h1{ color:#38bdf8; margin-bottom:15px; }
        .upload-section { border: 2px dashed #38bdf8; padding: 40px; border-radius: 15px; margin-bottom: 25px; cursor: pointer; }
        button{ background:#38bdf8; color:black; border:none; padding:15px 38px; border-radius:12px; font-size:17px; font-weight:bold; cursor:pointer; width: 100%; }
        button:disabled{ background:#64748b; cursor:not-allowed; }
        #result-area { display: none; margin-top: 30px; padding: 25px; background: #0f172a; border: 1px solid #38bdf8; border-radius: 12px; text-align: left; }
        #result-text { color:#cbd5e1; white-space: pre-wrap; line-height: 1.8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 校园安全 AI 风险识别</h1>
        <p style="color:#cbd5e1">实时调用 DeepSeek 引擎进行专业安全评估</p >
        
        <div class="upload-section" onclick="alert('图像特征提取成功')">
            <div style="font-size:40px">📸</div>
            <p>点击上传校园实拍照片</p >
        </div>

        <button id="start-btn">开始 AI 智能识别</button>

        <div id="result-area">
            <h3 style="color:#38bdf8; margin-top:0;">🔍 识别分析报告：</h3>
            <div id="result-text">正在通过 Vercel 安全隧道呼叫 AI...</div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('start-btn');
        const resultArea = document.getElementById('result-area');
        const resultText = document.getElementById('result-text');

        btn.onclick = async function() {
            btn.disabled = true;
            btn.innerText = "数据传输中...";
            resultArea.style.display = "block";
            resultText.innerText = "正在请求后端 API 并等待 DeepSeek 响应...";

            try {
                const response = await fetch('/api/check?t=' + Date.now(), { method: 'POST' });
                const result = await response.json();
                
                if (result.content) {
                    resultText.innerText = result.content;
                } else {
                    resultText.innerText = "⚠️ 识别完成但未返回文字。请确认 Vercel 环境变量名是否为 DEEPSEEK_KEY";
                }
            } catch (error) {
                resultText.innerText = "⚠️ 无法连接到 API。";
            } finally {
                btn.disabled = false;
                btn.innerText = "重新识别";
            }
        };
    </script>
</body>
</html>
