<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI校园安全风险识别系统</title>
<style>
    body{ margin:0; padding:0; background:#0f172a; font-family:Arial,sans-serif; color:white; }
    .container{ width:90%; max-width:800px; margin:50px auto; background:#1e293b; padding:40px; border-radius:20px; box-shadow:0 0 30px rgba(0,0,0,0.5); text-align:center; }
    h1{ color:#38bdf8; margin-bottom:15px; font-size:34px; }
    .subtitle{ color:#cbd5e1; margin-bottom:35px; line-height:1.8; }
    .ai-box{ background:#334155; padding:25px; border-radius:16px; margin-top:25px; text-align:left; line-height:1.9; }
    button{ background:#38bdf8; color:black; border:none; padding:15px 38px; border-radius:12px; font-size:17px; font-weight:bold; cursor:pointer; transition:0.3s; margin-top:20px; }
    button:hover{ opacity:0.9; transform:scale(1.03); }
    button:disabled{ background:#64748b; cursor:not-allowed; }
    .footer{ margin-top:35px; color:#94a3b8; font-size:14px; }
    #result-area { display: none; margin-top: 20px; border-left: 4px solid #38bdf8; padding: 20px; background: #1e293b; border-radius: 12px; text-align: left; }
</style>
</head>
<body>

<div class="container">
    <h1>🚨 AI校园安全风险识别系统</h1>
    <p class="subtitle">本系统基于人工智能视觉识别技术，可对校园常见安全隐患进行智能分析，辅助校园安全管理与应急风险排查。</p >

    <button id="start-btn">开始AI风险识别</button>

    <div id="result-area">
        <h3 style="color:#38bdf8; margin-top:0;">🔍 AI 识别分析结果：</h3>
        <div id="result-text" style="color:#cbd5e1; line-height:1.6;">正在请求 AI 智能体，请稍候...</div>
    </div>

    <div class="ai-box">
        <h2>📌 可识别风险场景</h2>
        <div style="line-height:2">
            ✅ 消防通道堵塞 | ✅ 电动车违规停放<br>
            ✅ 灭火器被遮挡 | ✅ 宿舍违规用电<br>
            ✅ 楼道杂物堆积 | ✅ 地面湿滑风险
        </div>
    </div>

    <div class="footer">智慧校园 · 应急管理专业课程设计</div>
</div>

<script>
    const btn = document.getElementById('start-btn');
    const resultArea = document.getElementById('result-area');
    const resultText = document.getElementById('result-text');

    btn.onclick = async function() {
        // 1. 设置状态
        btn.disabled = true;
        btn.innerText = "正在分析中...";
        resultArea.style.display = "block";
        resultText.innerText = "正在连接后端 API 并调用扣子智能体...";

        try {
            // 2. 调用我们在 GitHub 新建的 api/check.js
            const response = await fetch('/api/check', { method: 'POST' });
            const result = await response.json();
            
            // 3. 提取 AI 说的话
            if (result.data) {
                // 扣子 v3 接口通常返回一个消息数组，我们找回复内容
                const messages = result.data;
                const lastMsg = messages.reverse().find(m => m.type === 'answer' || (m.role === 'assistant' && m.content));
                resultText.innerText = lastMsg ? lastMsg.content : "识别完成。";
            } else {
                resultText.innerText = "未获得有效结果，请检查 API 配置。";
            }
        } catch (error) {
            resultText.innerText = "系统调用失败，请确认 Vercel 的 COZE_API_KEY 已添加并重新部署。";
        } finally {
            btn.disabled = false;
            btn.innerText = "开始AI风险识别";
        }
    };
</script>

</body>
</html>
