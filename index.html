<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI校园安全风险识别系统</title>
    <style>
        body{ margin:0; padding:0; background:#0f172a; font-family:Arial,sans-serif; color:white; }
        .container{ width:90%; max-width:800px; margin:50px auto; background:#1e293b; padding:40px; border-radius:20px; box-shadow:0 0 30px rgba(0,0,0,0.5); text-align:center; }
        h1{ color:#38bdf8; margin-bottom:15px; }
        .upload-section { 
            border: 2px dashed #38bdf8; padding: 40px; border-radius: 15px; margin-bottom: 25px; cursor: pointer; transition: 0.3s; position: relative;
        }
        .upload-section:hover { background: #334155; }
        .upload-section input[type="file"] {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer;
        }
        button{ background:#38bdf8; color:black; border:none; padding:15px 38px; border-radius:12px; font-size:17px; font-weight:bold; cursor:pointer; width: 100%; transition: 0.3s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }
        button:disabled{ background:#64748b; cursor:not-allowed; transform: none; }
        #result-area { display: none; margin-top: 30px; padding: 25px; background: #0f172a; border: 1px solid #38bdf8; border-radius: 12px; text-align: left; }
        #result-text { color:#cbd5e1; white-space: pre-wrap; line-height: 1.8; font-size: 15px; min-height: 100px; }
        .footer{ margin-top:40px; color:#94a3b8; font-size:13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 校园安全 AI 风险识别</h1>
        <p style="color:#cbd5e1">基于 DeepSeek-V3 的实时安全评估系统</p>
        
        <div class="upload-section">
            <input type="file" id="file-input" accept="image/*">
            <div id="upload-content">
                <div style="font-size:50px; margin-bottom:10px;">📸</div>
                <p id="file-name">点击选择校园实拍照片</p>
            </div>
        </div>

        <button id="start-btn">开始 AI 智能识别</button>

        <div id="result-area">
            <h3 style="color:#38bdf8; margin-top:0;">🔍 识别分析报告：</h3>
            <div id="result-text"></div>
        </div>
        <div class="footer">应急管理专业 · 数字化校园安全课题演示</div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name');
        const btn = document.getElementById('start-btn');
        const resultArea = document.getElementById('result-area');
        const resultText = document.getElementById('result-text');

        fileInput.onchange = function() {
            if (fileInput.files.length > 0) {
                fileNameDisplay.innerText = "✅ 图片已就绪: " + fileInput.files[0].name;
                fileNameDisplay.style.color = "#38bdf8";
            }
        };

        btn.onclick = async function() {
            if (fileInput.files.length === 0) {
                alert("请先上传照片！");
                return;
            }

            btn.disabled = true;
            btn.innerText = "分析中...";
            resultArea.style.display = "block";
            resultText.innerText = "正在安全连接 DeepSeek 大模型服务器...";

            try {
                // 💡 恢复为相对路径，配合后端的跨域头，双重保险
                const response = await fetch('/api/check?t=' + Date.now());
                const result = await response.json();
                
                let content = result.content || "未获取到有效报告内容";

                let i = 0;
                resultText.innerText = "";
                const timer = setInterval(() => {
                    resultText.innerText += content[i];
                    i++;
                    if (i >= content.length) {
                        clearInterval(timer);
                        btn.disabled = false;
                        btn.innerText = "重新识别";
                    }
                }, 10);

            } catch (error) {
                resultText.innerText = "⚠️ 访问接口失败，正在尝试备用安全通道...";
                
                // 💡 备用通道：如果相对路径还被拦截，直接轰炸绝对路径
                try {
                    const resBackup = await fetch('https://compus-safely-ai.vercel.app/api/check?t=' + Date.now());
                    const dataBackup = await resBackup.json();
                    let content = dataBackup.content || "未获取到有效报告内容";
                    resultText.innerText = content;
                    btn.disabled = false;
                    btn.innerText = "重新识别";
                } catch(e) {
                    resultText.innerText = "⚠️ 彻底连接失败。请尝试使用手机微信打开此网址，或更换浏览器。";
                    btn.disabled = false;
                    btn.innerText = "重试一次";
                }
            }
        };
    </script>
</body>
</html>
