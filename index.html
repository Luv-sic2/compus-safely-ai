<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI校园安全风险识别系统</title>
    <style>
        body{ margin:0; padding:0; background:#0f172a; font-family:Arial,sans-serif; color:white; }
        .container{ width:90%; max-width:800px; margin:50px auto; background:#1e293b; padding:40px; border-radius:20px; box-shadow:0 0 30px rgba(0,0,0,0.5); text-align:center; }
        h1{ color:#38bdf8; margin-bottom:15px; }
        .upload-section { 
            border: 2px dashed #38bdf8; padding: 40px; border-radius: 15px; margin-bottom: 25px; cursor: pointer; transition: 0.3s; position: relative;
        }
        .upload-section:hover { background: #334155; }
        .upload-section input[type="file"] {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer;
        }
        button{ background:#38bdf8; color:black; border:none; padding:15px 38px; border-radius:12px; font-size:17px; font-weight:bold; cursor:pointer; width: 100%; transition: 0.3s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }
        button:disabled{ background:#64748b; cursor:not-allowed; transform: none; }
        #result-area { display: none; margin-top: 30px; padding: 25px; background: #0f172a; border: 1px solid #38bdf8; border-radius: 12px; text-align: left; }
        #result-text { color:#cbd5e1; white-space: pre-wrap; line-height: 1.8; font-size: 15px; min-height: 100px; }
        .footer{ margin-top:40px; color:#94a3b8; font-size:13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 校园安全 AI 风险识别</h1>
        <p style="color:#cbd5e1">数字化校园安全课题演示 · 实时对接 AI 风险识别 model</p>
        
        <div class="upload-section">
            <input type="file" id="file-input" accept="image/*">
            <div id="upload-content">
                <div style="font-size:50px; margin-bottom:10px;">📸</div>
                <p id="file-name">点击选择校园实拍照片</p>
                <p style="font-size:12px; color:#94a3b8;">支持从手机相册或电脑本地上传照片</p>
            </div>
        </div>

        <button id="start-btn">开始 AI 智能识别</button>

        <div id="result-area">
            <h3 style="color:#38bdf8; margin-top:0;">🔍 识别分析报告：</h3>
            <div id="result-text"></div>
        </div>
        <div class="footer">应急管理专业 · 数字化课题技术实现方案</div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name');
        const btn = document.getElementById('start-btn');
        const resultArea = document.getElementById('result-area');
        const resultText = document.getElementById('result-text');

        // 检测文件上传状态
        fileInput.onchange = function() {
            if (fileInput.files.length > 0) {
                fileNameDisplay.innerText = "✅ 照片已成功载入: " + fileInput.files[0].name;
                fileNameDisplay.style.color = "#38bdf8";
                fileNameDisplay.style.fontWeight = "bold";
            }
        };

        // 炫酷的打字机动画
        function showTextWithAnimation(text) {
            let i = 0;
            resultText.innerText = "";
            const timer = setInterval(() => {
                resultText.innerText += text[i];
                i++;
                if (i >= text.length) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.innerText = "重新识别";
                }
            }, 12);
        }

        // 点击按钮向 Vercel 后台发送请求
        btn.onclick = async function() {
            if (fileInput.files.length === 0) {
                alert("请先上传一张校园照片！");
                return;
            }

            btn.disabled = true;
            btn.innerText = "正在分析图像特征...";
            resultArea.style.display = "block";
            resultText.innerText = "正在向云计算节点发送数据包，并呼叫大模型大脑...";

            try {
                // 💡 修复：使用更安全的相对路径与 POST 暗号投递
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "执行校园安全风险实时识别分析。" 
                    })
                });

                // 如果后台没开门，直接抓出错误原因
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.content || `服务器报错 (状态码: ${response.status})`);
                }

                const result = await response.json();
                if (result.content) {
                    showTextWithAnimation(result.content);
                } else {
                    resultText.innerText = "⚠️ 接口已连通，但未收到有效报告，请检查 DeepSeek 余额。";
                    btn.disabled = false;
                    btn.innerText = "重试";
                }
            } catch (err) {
                // 白话版错误提示，哪里不通看这里一目了然
                resultText.innerText = "❌ 连接失败。原因：" + err.message + 
                                       "\n\n请按照以下两点排查：\n" +
                                       "1. 必须在 Vercel 网页后台的 Settings -> Environment Variables 里添加名为 DEEPSEEK_KEY 的钥匙。\n" +
                                       "2. 修改代码后，必须等 Vercel 后台重新部署（Redeploy）成 Ready 状态，再刷新线上网址测试。";
                btn.disabled = false;
                btn.innerText = "重试一次";
            }
        };
    </script>
</body>
</html>
